# Produção: banco, API e front, tudo em containers.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Lê o .env da raiz (POSTGRES_*, JWT_*, CORS_ORIGIN, DOMAIN). Só o Caddy expõe
# portas para fora (80/443); front, API e banco conversam pela rede interna.

services:
  postgres:
    image: postgres:16-alpine
    container_name: transppass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transppass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-transppass_pcm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-transppass} -d ${POSTGRES_DB:-transppass_pcm}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: transppass-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-transppass}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-transppass_pcm}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: transppass-web
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      - api

  # Porta de entrada: HTTPS automático para o DOMAIN do .env, repassando ao web.
  caddy:
    image: caddy:2-alpine
    container_name: transppass-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env (ex.: transppass.online)}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
