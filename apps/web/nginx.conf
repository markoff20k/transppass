# nginx dentro do container do front: SPA + proxy da API para o serviço `api`.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Front (SPA): qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API NestJS (mantém o prefixo /api); `api` é o nome do serviço no compose.
    # Resolver do Docker + variável: o nginx sobe mesmo se a API ainda não
    # estiver de pé e acompanha o IP quando o container da API reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets com hash podem ficar em cache por muito tempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
