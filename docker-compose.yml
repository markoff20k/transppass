services:
  postgres:
    image: postgres:16-alpine
    container_name: transppass-pcm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5433:5432'  # 5432 no host ja e usado pelo PostgreSQL 17 local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
